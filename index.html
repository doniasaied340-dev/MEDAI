<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedAI — הרשמה</title>
<meta name="description" content="MedAI — הרשמת משתמש חדש: שם מלא, טלפון נייד ותעודת זהות" />
<link rel="icon" type="image/png" href="assets/images/logo-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="screen screen--register">

  <div class="register-bg" aria-hidden="true">
    <img src="assets/images/registration-people.png" alt="" />
  </div>

  <div class="status-bar" aria-hidden="true">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons">••••  📶  🔋</span>
  </div>

  <header class="logo-header">
    <img src="assets/images/logo-header.png" alt="MedAI" />
  </header>

  <main class="content">

    <div class="register-hero">
      <img class="register-hero__icon" src="assets/images/logo-icon.png" alt="MedAI" />
      <h1 class="register-hero__title">ברוכים הבאים ל-MEDAI</h1>
      <p class="register-hero__subtitle">אנחנו נעזור לך לזכור, להבין ולהרגיש בטוח</p>
      <p class="register-hero__subtitle">בואו נתחיל</p>
    </div>

    <form class="form" id="register-form" action="#" onsubmit="return false;">

      <div class="field">
        <label class="field__label" for="reg-name">שם מלא</label>
        <div class="field__input-wrap">
          <input class="field__input field__input--with-icon" type="text" id="reg-name" name="reg-name" placeholder="לדוגמה: יעל כהן" autocomplete="name" />
          <span class="field__input-icon" aria-hidden="true"><img src="assets/icons/icon-user.png" alt="" /></span>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="reg-phone">טלפון נייד</label>
        <div class="field__input-wrap">
          <input class="field__input field__input--with-icon" type="tel" id="reg-phone" name="reg-phone" placeholder="05X-XXXXXXX" autocomplete="tel" />
          <span class="field__input-icon" aria-hidden="true"><img src="assets/icons/icon-phone.png" alt="" class="icon-tint-primary" /></span>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="reg-id">תעודת זהות</label>
        <div class="field__input-wrap">
          <input class="field__input field__input--with-icon" type="text" id="reg-id" name="reg-id" placeholder="9 ספרות" inputmode="numeric" autocomplete="off" />
          <span class="field__input-icon" aria-hidden="true"><img src="assets/icons/icon-id-card.png" alt="" /></span>
        </div>
      </div>

    </form>

  </main>

  <div class="btn-footer">
    <button type="submit" form="register-form" class="btn btn--primary" id="register-continue-btn">
      המשך
    </button>
    <button type="button" class="register-footer-link" id="register-login-link">
      יש לך כבר חשבון? <strong>התחבר</strong>
    </button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedAI — בדיקת התנגשויות תרופות</title>
<meta name="description" content="MedAI — תוצאת בדיקת התנגשויות בין תרופות" />
<link rel="icon" type="image/png" href="assets/images/logo-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="screen">

  <div class="status-bar" aria-hidden="true">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons">••••  📶  🔋</span>
  </div>

  <header class="logo-header">
    <img src="assets/images/logo-header.png" alt="MedAI" />
  </header>

  <header class="page-header page-header--onboarding">
    <a class="page-header__icon-btn" href="home.html" aria-label="חזרה למסך הראשי">
      <img src="assets/icons/icon-back.png" alt="" />
    </a>
    <div class="page-header__title-group">
      <p class="page-header__title">בדיקת התנגשויות</p>
    </div>
  </header>

  <main class="content">

    <div class="result">
      <img class="result__icon" src="assets/icons/icon-shield-check.png" alt="" />
      <h1 class="result__title result__title--primary">אין התנגשויות תרופות</h1>
      <p class="result__caption" id="interaction-caption">התרופות שנבחרו מתאימות לשימוש יחד.</p>
    </div>

    <div class="info-card">
      <img src="assets/icons/icon-info.png" alt="" />
      <p>אם מופיעים תסמינים חריגים - פנה לרופא.</p>
    </div>

  </main>

  <div class="btn-footer">
    <a class="btn btn--primary" href="home.html">סגור</a>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>

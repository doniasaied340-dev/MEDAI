<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedAI — התראה קריטית</title>
<meta name="description" content="MedAI — התראה על שינוי במרשם התרופות" />
<link rel="icon" type="image/png" href="assets/images/logo-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="screen">

  <div class="status-bar" aria-hidden="true">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons">••••  📶  🔋</span>
  </div>

  <header class="logo-header">
    <img src="assets/images/logo-header.png" alt="MedAI" />
  </header>

  <header class="page-header page-header--onboarding">
    <a class="page-header__icon-btn" href="home.html" aria-label="חזרה למסך הראשי">
      <img src="assets/icons/icon-back.png" alt="" />
    </a>
    <div class="page-header__title-group">
      <p class="page-header__title">התראה קריטית</p>
    </div>
  </header>

  <main class="content">

    <div class="result">
      <img class="result__icon result__icon--md" src="assets/icons/icon-warning.png" alt="" />
      <h1 class="result__title result__title--alert">יש שינוי במרשם!</h1>
      <p class="result__caption">התוספה תרופה חדשה עשויה להשפיע על התרופות הקיימות שלך. אנא עיין בפרטים לפני הנטילה הבאה.</p>
    </div>

    <div class="new-med-card">
      <img src="assets/images/ibuprofen-400mg.png" alt="איבופרופן" />
      <div>
        <p class="new-med-card__label">התרופה החדשה:</p>
        <p class="new-med-card__name">איבופרופן 400 מ״ג</p>
      </div>
    </div>

  </main>

  <div class="result__footer">
    <a class="btn btn--primary" href="tel:*3000">
      <img src="assets/icons/icon-phone.png" alt="" />
      פנייה לרופא
    </a>
    <a class="btn btn--outline" href="home.html">אני מבין, תודה</a>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
